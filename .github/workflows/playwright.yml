name: Playwright Tests

permissions:
  contents: write
  actions: write
  id-token: write
  pages: write

on:
#   push:
#     branches: [ main, master ]
#   schedule:
#     - cron: '0 0,8,16 * * *'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [mobile-safari, sticker-desktop-chrome, sticker-mobile-safari]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
      
    - name: Get Playwright version
      run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> $GITHUB_ENV
      
    - name: Cache Playwright Browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
        restore-keys: |
          ${{ runner.os }}-playwright-
          
    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps
      
    - name: Install Playwright System Dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps
      
    - name: Run Playwright tests
      continue-on-error: true
      env:
        MONGO_URI: ${{ secrets.MONGO_URI }}
        MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME }}
        MONGO_COLL_NAME: ${{ secrets.MONGO_COLL_NAME }}
        BASE_URL: ${{ secrets.BASE_URL || 'https://members.vehiclehistory.report' }}
      run: npx playwright test --project=${{ matrix.project }} --reporter=blob
      
    - name: Upload Playwright Blob Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: blob-report-${{ matrix.project }}
        path: blob-report
        retention-days: 7

  report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          
      - name: Install dependencies for report
        run: npm ci
          
      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blobs
          pattern: blob-report-*
          merge-multiple: true
          
      - name: Merge Playwright Reports into HTML & JSON
        run: npx playwright merge-reports --reporter=html,json ./all-blobs
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json

      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        id: deployment
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          
      - name: Send Slack Notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_SERVER: ${{ github.server_url }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN: ${{ github.run_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF: ${{ github.ref_name }}
          GITHUB_EVENT: ${{ github.event_name }}
          TEST_RESULT: ${{ needs.test.result }}
          REPORT_URL: ${{ steps.deployment.outputs.page_url }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: node slack-notify.js
