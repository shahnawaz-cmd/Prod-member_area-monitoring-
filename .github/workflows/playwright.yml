name: Playwright Tests

permissions:
  contents: write
  issues: write
  pages: write
  actions: write
  id-token: write

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 */12 * * *'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_URL: ${{ secrets.BASE_URL || 'https://members.vehiclehistory.report' }}

jobs:
  test:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [mobile-safari, sticker-desktop-chrome, sticker-mobile-safari, cancel-subscription]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
      
    - name: Get Playwright version
      run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> $GITHUB_ENV
      
    - name: Cache Playwright Browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
        restore-keys: |
          ${{ runner.os }}-playwright-
          
    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps
      
    - name: Install Playwright System Dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps

    - name: Mask Sensitive Secrets in CI Logs
      run: |
        echo "::add-mask::${{ secrets.MONGO_URI }}"
        echo "::add-mask::${{ secrets.GEMINI_API_KEY }}"
        echo "::add-mask::${{ secrets.SLACK_WEBHOOK_URL }}"
      
    - name: Run Playwright tests
      id: playwright-run
      continue-on-error: true
      env:
        MONGO_URI: ${{ secrets.MONGO_URI }}
        MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME }}
        MONGO_COLL_NAME: ${{ secrets.MONGO_COLL_NAME }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        SLOW_NETWORK: 'false'
      run: npx playwright test --project=${{ matrix.project }} --reporter=blob

    - name: Run AI Agentic Self-Healer (On Test Failure)
      if: steps.playwright-run.outcome == 'failure'
      timeout-minutes: 5
      run: npm run heal:prod
      env:
        MONGO_URI: ${{ secrets.MONGO_URI }}
        MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME }}
        MONGO_COLL_NAME: ${{ secrets.MONGO_COLL_NAME }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    # - name: Auto-Commit & Push AI Healed Locators Back to Repo
    #   if: steps.playwright-run.outcome == 'failure'
    #   run: |
    #     git config user.name "AI-Healer[bot]"
    #     git config user.email "ai-healer@users.noreply.github.com"
    #     git add task/ utils/
    #     git commit -m "chore(ai-healer): auto-repair locators via Gemini AI" || echo "No changes to commit"
    #     git push

    - name: Upload Failure Artifacts (Videos, Traces, Screenshots)
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: failure-artifacts-${{ matrix.project }}
        path: test-results/
        retention-days: 3
      
    - name: Upload Playwright Blob Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: blob-report-${{ matrix.project }}
        path: blob-report
        retention-days: 1

  report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          
      - name: Install dependencies for report
        run: npm ci
          
      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blobs
          pattern: blob-report-*
          merge-multiple: true
          
      - name: Merge Playwright Reports into HTML & JSON
        run: npx playwright merge-reports --reporter=html,json ./all-blobs
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json

      - name: Automated GitHub Issue Manager (Create/Close Issues)
        if: always()
        run: node scripts/manage-issues.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SERVER: ${{ github.server_url }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN: ${{ github.run_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT: ${{ github.event_name }}

      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        id: deployment
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          force_orphan: true
          
      - name: Send Slack Notification
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_SERVER: ${{ github.server_url }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN: ${{ github.run_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT: ${{ github.event_name }}
          TEST_RESULT: ${{ needs.test.result }}
          REPORT_URL: ${{ steps.deployment.outputs.page_url }}
        run: node slack-notify.js
